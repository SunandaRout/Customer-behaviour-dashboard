<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Customer Behaviour Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--panel2:#101f33;--line:#20334b;--text:#e9f1fb;--muted:#8ea3bb;--accent:#39b7ff;--accent2:#8b5cf6;--green:#35d399;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#122d48 0,#07111f 38%,#050b14 100%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}.wrap{max-width:1500px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:1.5px;font-size:12px}.hero h1{font-size:32px;margin:6px 0}.hero p{margin:0;color:var(--muted)}.badge{padding:10px 14px;border:1px solid #25415d;background:#0b1929;border-radius:12px;color:#a9c6df;font-size:13px}.filters{display:flex;flex-wrap:wrap;gap:12px;background:#0b1727;border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:18px}.filters label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}.filters select{background:#101f33;color:white;border:1px solid #2a4059;border-radius:9px;padding:9px 28px 9px 11px;min-width:145px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.card,.chartbox{background:linear-gradient(145deg,#0e1c2e,#0a1524);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px #0004}.card{padding:18px}.label{color:var(--muted);font-size:12px}.value{font-size:28px;font-weight:800;margin:8px 0 4px}.delta{font-size:11px;color:var(--green)}.grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;margin-bottom:14px}.chartbox{padding:16px;min-height:320px}.chartbox h3{font-size:14px;margin:0 0 14px}.wide{grid-column:span 2}.canvas{height:255px}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.insight{padding:18px;background:#0d1b2c;border:1px solid var(--line);border-radius:14px}.insight strong{display:block;font-size:13px;margin-bottom:8px}.insight span{font-size:12px;color:var(--muted);line-height:1.5}.footer{padding:20px 0;color:#667d95;font-size:11px;text-align:center}.error{padding:40px;text-align:center;color:#ffb4b4}.loading{text-align:center;padding:80px;color:var(--muted)}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.insights{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:16px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:25px}.kpis{grid-template-columns:1fr}.filters select{width:100%}.filters>div{width:100%}}
</style></head>
<body><div class="wrap">
<header class="hero"><div><div class="eyebrow">DATA ANALYTICS PORTFOLIO • CUSTOMER INTELLIGENCE</div><h1>Customer Behaviour Analytics</h1><p>Interactive customer shopping insights built from the project dataset.</p></div><div class="badge">● LIVE DATASET • 3,900+ RECORDS</div></header>
<section class="filters">
<div><label>GENDER</label><select id="gender"><option>All</option></select></div>
<div><label>CATEGORY</label><select id="category"><option>All</option></select></div>
<div><label>SEASON</label><select id="season"><option>All</option></select></div>
<div><label>SUBSCRIPTION</label><select id="subscription"><option>All</option></select></div>
<div><label>PAYMENT</label><select id="payment"><option>All</option></select></div>
</section>
<div id="app" class="loading">Loading customer dataset…</div>
<div class="footer">Customer Behaviour Dashboard • Python • Pandas • SQL • Power BI • Web Analytics</div>
</div>
<script>
const CSV_URL='https://raw.githubusercontent.com/SunandaRout/Customer-behaviour-dashboard/main/customer_shopping_behavior.csv';
let rows=[],charts={};
function parseCSV(text){let lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/),head=lines.shift().split(',');return lines.map(line=>{let a=[],cur='',q=false;for(let c of line){if(c==='"')q=!q;else if(c===','&&!q){a.push(cur);cur=''}else cur+=c}a.push(cur);let o={};head.forEach((h,i)=>o[h.trim()]=(a[i]??'').trim());return o})}
const money=n=>'$'+Math.round(n).toLocaleString();const pct=n=>(n*100).toFixed(1)+'%';
function unique(key){return [...new Set(rows.map(r=>r[key]).filter(Boolean))].sort()}
function fill(id,key){let s=document.getElementById(id);unique(key).forEach(v=>{let o=document.createElement('option');o.textContent=v;s.appendChild(o)})}
function filtered(){let fs=[['gender','Gender'],['category','Category'],['season','Season'],['subscription','Subscription Status'],['payment','Payment Method']];return rows.filter(r=>fs.every(([id,k])=>{let v=document.getElementById(id).value;return v==='All'||r[k]===v}))}
function group(data,key,metric='count'){let m={};data.forEach(r=>{let k=r[key]||'Unknown';m[k]=(m[k]||0)+(metric==='sum'?+r['Purchase Amount (USD)']:1)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function destroy(){Object.values(charts).forEach(c=>c.destroy());charts={}}
function chart(id,type,labels,data,label,colors){let c=new Chart(document.getElementById(id),{type,data:{labels,datasets:[{label,data,backgroundColor:colors||'rgba(57,183,255,.72)',borderColor:colors||'#39b7ff',borderWidth:2,borderRadius:6,fill:type==='line',tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8ea3bb'},grid:{color:'#20334b'}},y:{ticks:{color:'#8ea3bb'},grid:{color:'#20334b'}}}}});charts[id]=c}
function render(){let d=filtered(),total=d.length,rev=d.reduce((s,r)=>s+(+r['Purchase Amount (USD)']||0),0),avg=total?d.reduce((s,r)=>s+(+r['Review Rating']||0),0)/total:0,subs=total?d.filter(r=>r['Subscription Status']==='Yes').length/total:0,prev=d.reduce((s,r)=>s+(+r['Previous Purchases']||0),0);
 document.getElementById('app').innerHTML=`<section class="kpis"><div class="card"><div class="label">TOTAL CUSTOMERS</div><div class="value">${total.toLocaleString()}</div><div class="delta">Filtered records</div></div><div class="card"><div class="label">TOTAL PURCHASE VALUE</div><div class="value">${money(rev)}</div><div class="delta">Current selection</div></div><div class="card"><div class="label">AVERAGE ORDER VALUE</div><div class="value">${money(total?rev/total:0)}</div><div class="delta">Revenue / customer</div></div><div class="card"><div class="label">AVG. REVIEW RATING</div><div class="value">${avg.toFixed(2)} ★</div><div class="delta">Customer satisfaction</div></div><div class="card"><div class="label">SUBSCRIBER RATE</div><div class="value">${pct(subs)}</div><div class="delta">Subscription status</div></div></section><section class="grid"><div class="chartbox wide"><h3>Purchase Value by Category</h3><div class="canvas"><canvas id="cat"></canvas></div></div><div class="chartbox"><h3>Customer Mix by Gender</h3><div class="canvas"><canvas id="genderChart"></canvas></div></div><div class="chartbox"><h3>Revenue by Season</h3><div class="canvas"><canvas id="seasonChart"></canvas></div></div><div class="chartbox"><h3>Top 10 Locations</h3><div class="canvas"><canvas id="location"></canvas></div></div><div class="chartbox"><h3>Payment Method Mix</h3><div class="canvas"><canvas id="paymentChart"></canvas></div></div><div class="chartbox"><h3>Shipping Type</h3><div class="canvas"><canvas id="shipping"></canvas></div></div></section><section class="insights"><div class="insight"><strong>🛍 Category leader</strong><span id="i1"></span></div><div class="insight"><strong>💳 Preferred payment</strong><span id="i2"></span></div><div class="insight"><strong>📦 Shipping behaviour</strong><span id="i3"></span></div></section>`;
 destroy();let cg=group(d,'Category','sum').slice(0,8);chart('cat','bar',cg.map(x=>x[0]),cg.map(x=>x[1]),'Revenue','#39b7ff');let gg=group(d,'Gender').slice(0,5);chart('genderChart','doughnut',gg.map(x=>x[0]),gg.map(x=>x[1]),'Customers',['#39b7ff','#8b5cf6','#35d399','#f59e0b']);let sg=group(d,'Season','sum');chart('seasonChart','bar',sg.map(x=>x[0]),sg.map(x=>Math.round(x[1])),'Revenue','#8b5cf6');let lg=group(d,'Location','sum').slice(0,10);chart('location','bar',lg.map(x=>x[0]),lg.map(x=>Math.round(x[1])),'Revenue','#35d399');let pg=group(d,'Payment Method').slice(0,8);chart('paymentChart','doughnut',pg.map(x=>x[0]),pg.map(x=>x[1]),'Customers',['#39b7ff','#8b5cf6','#35d399','#f59e0b','#ef4444','#14b8a6']);let sh=group(d,'Shipping Type').slice(0,8);chart('shipping','bar',sh.map(x=>x[0]),sh.map(x=>x[1]),'Customers','#f59e0b');
 document.getElementById('i1').textContent=cg.length?`${cg[0][0]} generates the highest purchase value in the selected customer segment (${money(cg[0][1])}).`:'No data for this selection.';document.getElementById('i2').textContent=pg.length?`${pg[0][0]} is the most common payment method with ${pg[0][1].toLocaleString()} customers.`:'No data for this selection.';document.getElementById('i3').textContent=sh.length?`${sh[0][0]} is the most frequently selected shipping option (${sh[0][1].toLocaleString()} customers).`:'No data for this selection.';
}
async function init(){try{let t=await fetch(CSV_URL);if(!t.ok)throw Error('Dataset unavailable');rows=parseCSV(await t.text());fill('gender','Gender');fill('category','Category');fill('season','Season');fill('subscription','Subscription Status');fill('payment','Payment Method');['gender','category','season','subscription','payment'].forEach(id=>document.getElementById(id).addEventListener('change',render));render()}catch(e){document.getElementById('app').innerHTML='<div class="error"><h2>Dashboard could not load</h2><p>Please check the GitHub dataset or refresh the page.</p></div>'}}
init();
</script></body></html>
